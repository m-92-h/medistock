<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 60 200 230" width="400" height="400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A5C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E2238;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A889;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F5F0;stop-opacity:1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00D4AA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <path d="M200,68 L285,102 L285,178 Q285,240 200,275 Q115,240 115,178 L115,102 Z"
        fill="url(#shieldGrad)"
        stroke="#00D4AA"
        stroke-width="2"
        filter="url(#softShadow)"
        opacity="0.95"/>

  <path d="M200,80 L275,111 L275,178 Q275,232 200,264 Q125,232 125,178 L125,111 Z"
        fill="none"
        stroke="#00D4AA"
        stroke-width="0.8"
        opacity="0.3"/>

  <rect x="170" y="148" width="60" height="22" rx="4"
        fill="url(#crossGrad)"
        filter="url(#glow)"/>

  <rect x="189" y="129" width="22" height="60" rx="4"
        fill="url(#crossGrad)"
        filter="url(#glow)"/>

  <rect x="148" y="220" width="104" height="6" rx="3"
        fill="url(#tealGrad)"
        opacity="0.85"/>

  <circle cx="168" cy="237" r="4" fill="#00D4AA" opacity="0.9"/>
  <circle cx="200" cy="237" r="4" fill="#00D4AA" opacity="0.6"/>
  <circle cx="232" cy="237" r="4" fill="#00D4AA" opacity="0.35"/>
</svg>
